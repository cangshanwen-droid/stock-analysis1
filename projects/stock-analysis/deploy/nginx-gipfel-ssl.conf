# ============================================================
# Gipfel Nginx 配置 — HTTPS 就绪版
# 证书: /etc/ssl/gipfel.crt + /etc/ssl/gipfel.key (自签名, CN=106.54.26.86)
#
# ⚠️ 重要：腾讯云安全组当前未放行 TCP 443 入站！
#   请在腾讯云控制台 → 安全组 → 入站规则 添加：TCP:443 来源 0.0.0.0/0
#   放行后 HTTPS 立即生效（本配置 443 server 已就绪）。
#
# 启用 HTTP→HTTPS 强制重定向（可选）：
#   取消下面 80 server 块中 return 301 行的注释，并注释掉其 location 块。
# ============================================================

# HTTP :80 — 直连服务（安全组未放行 443 期间保证站点可用）
server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 10M;

    # 放行 443 后启用强制 HTTPS（注释掉下方 location 块）：
    # return 301 https://$host$request_uri;

    # Gipfel SaaS API (kept on 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stock trading API
    location /market {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stock frontend (static + full app incl. /static, /_next, /portfolio, /admin)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HTTPS :443 — 自签名证书（安全组放行后即可访问）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    client_max_body_size 10M;

    ssl_certificate     /etc/ssl/gipfel.crt;
    ssl_certificate_key /etc/ssl/gipfel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Gipfel SaaS API (kept on 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stock trading API
    location /market {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stock frontend (static + full app incl. /static, /_next, /portfolio, /admin)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
